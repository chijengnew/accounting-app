<svg xmlns="http://www.w3.org/2000/svg" width="600" height="280" viewBox="0 0 600 280" role="img" aria-labelledby="title desc">
  <title id="title">錢追著人跑</title>
  <desc id="desc">穿著紫色上衣的小人向右奔跑，綠色鈔票和金色硬幣緊追在後。</desc>
  <style>
    .bounce{animation:mc-bounce .36s ease-in-out infinite alternate}
    .leg-a{animation:mc-limb .72s ease-in-out infinite alternate;transform-origin:365px 170px}
    .leg-b{animation:mc-limb .72s ease-in-out -.72s infinite alternate;transform-origin:365px 170px}
    .arm-a{animation:mc-arm .72s ease-in-out infinite alternate;transform-origin:385px 125px}
    .arm-b{animation:mc-arm .72s ease-in-out -.72s infinite alternate;transform-origin:385px 125px}
    .bill{animation:mc-bill 1.2s ease-in-out infinite alternate;transform-origin:245px 135px}
    .coin{animation:mc-coin .6s ease-in-out infinite alternate}
    .coin-small{animation:mc-coin .6s ease-in-out -.3s infinite alternate}
    .dash{animation:mc-dash .8s linear infinite}
    .dash-late{animation-delay:-.4s}
    @keyframes mc-bounce{to{transform:translateY(-9px)}}
    @keyframes mc-limb{from{transform:rotate(-34deg)}to{transform:rotate(38deg)}}
    @keyframes mc-arm{from{transform:rotate(-33deg)}to{transform:rotate(28deg)}}
    @keyframes mc-bill{from{transform:translate(-8px,9px) rotate(-10deg)}to{transform:translate(13px,-7px) rotate(8deg)}}
    @keyframes mc-coin{to{transform:translate(10px,-22px)}}
    @keyframes mc-dash{from{transform:translateX(50px);opacity:0}25%{opacity:.5}75%{opacity:.5}to{transform:translateX(-55px);opacity:0}}
    @media(prefers-reduced-motion:reduce){*{animation:none!important}}
  </style>
  <g fill="#8b91a5" opacity=".14">
    <ellipse cx="382" cy="240" rx="77" ry="7"/>
    <ellipse cx="236" cy="239" rx="52" ry="5"/>
    <ellipse cx="130" cy="239" rx="32" ry="4"/>
  </g>
  <g fill="none" stroke="#949bad" stroke-width="4" stroke-linecap="round">
    <path class="dash" d="M86 113h28m-52 18h39"/>
    <path class="dash dash-late" d="M274 204h28m158 16h35"/>
  </g>
  <g class="coin-small">
    <circle cx="95" cy="192" r="16" fill="#f9b932" stroke="#bd7c12" stroke-width="3"/>
    <path d="M95 182v20m5-17h-7c-6 0-6 7 0 7h4c6 0 6 7 0 7h-8" fill="none" stroke="#98600a" stroke-width="2.5" stroke-linecap="round"/>
  </g>
  <g class="coin">
    <circle cx="144" cy="168" r="26" fill="#ffd260" stroke="#cf901e" stroke-width="3"/>
    <circle cx="144" cy="168" r="20" fill="none" stroke="#e4a331" stroke-width="2"/>
    <path d="M144 153v30m8-25h-11c-8 0-8 10 0 10h5c8 0 8 10 0 10h-11" fill="none" stroke="#98600a" stroke-width="3.5" stroke-linecap="round"/>
  </g>
  <g class="bill">
    <path d="M192 104q48 10 101-2v63q-51 14-101 1z" fill="#72dca5" stroke="#247955" stroke-width="3.5" stroke-linejoin="round"/>
    <path d="M204 118q41 7 77-2v39q-40 8-77 1z" fill="none" stroke="#399b6e" stroke-width="2"/>
    <ellipse cx="243" cy="136" rx="15" ry="20" fill="#c4f3d6"/>
    <path d="M243 123v27m6-23h-9c-7 0-7 9 0 9h5c7 0 7 9 0 9h-10" fill="none" stroke="#247955" stroke-width="3" stroke-linecap="round"/>
    <path d="m211 179 8 9-14 8m63-17 10 8-9 10" fill="none" stroke="#247955" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="m300 120 13 5-3 10" fill="none" stroke="#247955" stroke-width="4" stroke-linecap="round"/>
  </g>
  <g class="bounce" stroke-linecap="round" stroke-linejoin="round">
    <g class="leg-b">
      <path d="m365 170-4 33-25 25" fill="none" stroke="#4b4b70" stroke-width="15"/>
      <path d="m337 226-7 8 15 5" fill="none" stroke="#39384e" stroke-width="12"/>
    </g>
    <g class="arm-b">
      <path d="m385 125-30 8-15-21" fill="none" stroke="#d58e68" stroke-width="12"/>
    </g>
    <g class="leg-a">
      <path d="m365 170 10 33 25 17" fill="none" stroke="#33334e" stroke-width="16"/>
      <path d="m399 219 5 9 13 1" fill="none" stroke="#24253a" stroke-width="12"/>
    </g>
    <path d="m374 113 27 14-17 50q-18 6-35-9z" fill="#8570ed" stroke="#6351c4" stroke-width="3"/>
    <path d="m379 160 12-30" stroke="#a695ff" stroke-width="5"/>
    <path d="m392 114 8-16" fill="none" stroke="#edb38f" stroke-width="14"/>
    <g class="arm-a">
      <path d="m385 125 18 26 26-14" fill="none" stroke="#f2bb98" stroke-width="13"/>
      <path d="m385 125 10 14" fill="none" stroke="#8570ed" stroke-width="18"/>
      <path d="m429 137 6-6" fill="none" stroke="#f2bb98" stroke-width="11"/>
    </g>
    <path d="M388 59q21-11 34 8l1 15 8 10-11 3q-1 18-18 15l-19-12-4-22z" fill="#f2bb98" stroke="#cf906e" stroke-width="2"/>
    <path d="M382 86q-18-12-8-32 4-10 18-7 5-13 15-5 20-7 22 13 9 13-9 19l-16-8-10 20-2-10z" fill="#35354b"/>
    <circle cx="387" cy="87" r="7" fill="#f2bb98"/>
    <path d="m410 78 7 1" stroke="#35354b" stroke-width="3"/>
    <circle cx="413" cy="87" r="2.5" fill="#35354b"/>
    <path d="m409 101 7-3" fill="none" stroke="#88482f" stroke-width="2.5"/>
    <path d="M443 64q-1 11 6 9 8-3-6-9" fill="#6abddd"/>
  </g>
</svg>
